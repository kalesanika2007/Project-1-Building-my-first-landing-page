<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — Clarity (Demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1B2430; --ink-soft: #2A3644; --bone: #ECE8DD;
    --amber: #D9A441; --amber-bright: #EAB94F; --teal: #2F6F6B;
    --slate: #5B6570; --slate-light: #8891A0; --white: #FDFCF9;
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--sans); background: var(--ink); color: var(--bone); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; -webkit-font-smoothing: antialiased; }
  .card { width: 100%; max-width: 380px; }
  .logo { font-family: var(--serif); font-weight: 600; font-size: 21px; display: flex; align-items: center; gap: 9px; justify-content: center; text-decoration: none; color: var(--bone); margin-bottom: 32px; }
  .logo-mark { width: 11px; height: 11px; border-radius: 3px; background: var(--amber); }
  h1 { font-family: var(--serif); font-weight: 500; font-size: 26px; text-align: center; margin-bottom: 8px; }
  .subtitle { text-align: center; font-size: 14.5px; color: var(--slate-light); margin-bottom: 28px; line-height: 1.5; }
  .demo-note { background: rgba(217,164,65,0.1); border: 1px solid rgba(217,164,65,0.3); border-radius: 10px; padding: 13px 16px; font-size: 13px; color: var(--amber-bright); line-height: 1.55; margin-bottom: 28px; }
  label { display: block; font-size: 13.5px; font-weight: 500; margin-bottom: 7px; color: #C4CAD3; }
  input { width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.14); background: var(--ink-soft); color: var(--bone); font-size: 15px; font-family: var(--sans); margin-bottom: 18px; }
  input:focus { outline: 2px solid var(--amber); outline-offset: 1px; border-color: transparent; }
  input::placeholder { color: var(--slate-light); }
  button { width: 100%; background: var(--amber); color: var(--ink); font-weight: 600; font-size: 15.5px; padding: 13px; border: none; border-radius: 8px; cursor: pointer; transition: background 0.15s; }
  button:hover { background: var(--amber-bright); }
  #status { margin-top: 16px; font-size: 13.5px; text-align: center; color: #A9D6D2; display: none; line-height: 1.5; }
  .back { display: block; text-align: center; margin-top: 24px; font-size: 13.5px; color: var(--slate-light); text-decoration: none; }
  .back:hover { color: var(--bone); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <div class="card">
    <a href="index.html" class="logo"><span class="logo-mark"></span>Clarity</a>
    <h1>Welcome back</h1>
    <p class="subtitle">Log in to start your next focus session.</p>
    <div class="demo-note">This is a demo page for a fictional product. Nothing you type here is stored, saved, or sent anywhere.</div>
 
    <form id="demoForm">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@university.edu" autocomplete="off">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="off">
      <button type="submit">Log in</button>
    </form>
    <p id="status">This is a demo — no account was created and no data was saved.</p>
    <a href="index.html" class="back">← Back to Clarity</a>
  </div>
 
  <script>
    // Demo-only: this form never submits, stores, or transmits any data.
    document.getElementById('demoForm').addEventListener('submit', function (e) {
      e.preventDefault();
      document.getElementById('status').style.display = 'block';
      this.reset();
    });
  </script>
</body>
</html>
